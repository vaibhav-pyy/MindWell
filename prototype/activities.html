<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MindWell — Activities &amp; Progress</title>
<link rel="stylesheet" href="styles.css">
<script src="nav.js"></script>
</head>
<body>
<div class="phone-wrap">
  <div class="phone">
    <div style="padding:24px 20px 4px;flex-shrink:0;">
      <div style="font-size:20px;font-weight:800;color:var(--teal-900);">Activities &amp; Progress</div>
      <div style="font-size:13px;color:var(--muted);margin-top:3px;">Small steps add up.</div>
    </div>
    <div style="flex-grow:1;overflow-y:auto;padding:16px 20px 12px;display:flex;flex-direction:column;gap:18px;">

      <div style="background:var(--teal-900);border-radius:20px;padding:18px 20px;display:flex;align-items:center;gap:16px;color:#FFFFFF;">
        <div style="width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,0.12);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;flex-shrink:0;">L4</div>
        <div style="flex-grow:1;">
          <div id="xpLabel" style="font-size:12px;color:rgba(255,255,255,0.85);">320 / 500 XP</div>
          <div style="height:7px;border-radius:4px;background:rgba(255,255,255,0.18);overflow:hidden;margin-top:6px;"><div id="xpFill" style="height:100%;width:64%;background:var(--amber);border-radius:4px;"></div></div>
        </div>
        <div style="text-align:center;flex-shrink:0;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" style="display:block;margin:0 auto;"><path d="M13 2 3 14h7l-1 8 11-14h-7l1-6z" fill="var(--amber)"/></svg>
          <div style="font-size:11px;color:rgba(255,255,255,0.85);margin-top:2px;">6d</div>
        </div>
      </div>

      <div>
        <div style="font-size:13px;font-weight:700;color:var(--teal-900);margin-bottom:10px;">Badges</div>
        <div style="display:grid;grid-template-columns:repeat(4, minmax(0, 1fr));gap:12px;">
          <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
            <div style="width:52px;height:52px;border-radius:50%;background:var(--teal-100);display:flex;align-items:center;justify-content:center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M5 12l4 4 10-10" stroke="var(--teal-700)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
            <div style="font-size:9.5px;color:var(--muted);text-align:center;line-height:1.3;">First Check-in</div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
            <div style="width:52px;height:52px;border-radius:50%;background:var(--amber-100);display:flex;align-items:center;justify-content:center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M13 2 3 14h7l-1 8 11-14h-7l1-6z" fill="var(--amber)"/></svg></div>
            <div style="font-size:9.5px;color:var(--muted);text-align:center;line-height:1.3;">3-Day Streak</div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
            <div style="width:52px;height:52px;border-radius:50%;background:var(--coral-100);display:flex;align-items:center;justify-content:center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="7" stroke="var(--coral-700)" stroke-width="1.8"/><path d="M12 8v4l3 2" stroke="var(--coral-700)" stroke-width="1.8" stroke-linecap="round"/></svg></div>
            <div style="font-size:9.5px;color:var(--muted);text-align:center;line-height:1.3;">Breathing Pro</div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
            <div style="width:52px;height:52px;border-radius:50%;background:var(--bg);border:1.5px dashed var(--border);display:flex;align-items:center;justify-content:center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="5" y="11" width="14" height="9" rx="2" stroke="var(--muted)" stroke-width="1.6"/><path d="M8 11V7a4 4 0 0 1 8 0v4" stroke="var(--muted)" stroke-width="1.6" fill="none"/></svg></div>
            <div style="font-size:9.5px;color:var(--muted);text-align:center;line-height:1.3;">7-Day Streak</div>
          </div>
        </div>
      </div>

      <div>
        <div style="font-size:13px;font-weight:700;color:var(--teal-900);margin-bottom:10px;">Today's activities</div>
        <div id="activityList" style="display:flex;flex-direction:column;gap:10px;"></div>
      </div>

    </div>
    <div id="navSlot"></div>
  </div>
</div>
<script>
document.getElementById('navSlot').innerHTML = renderBottomNav('activities');

let xp = 320;
const xpTarget = 500;
const activities = [
  { id: 1, title: 'Breathing Reset', meta: '5 min', xp: 15, done: false },
  { id: 2, title: 'Mindful Journaling', meta: '3 min', xp: 10, done: false },
  { id: 3, title: 'Short Walk Break', meta: '10 min', xp: 20, done: false },
  { id: 4, title: 'Gratitude Note', meta: '2 min', xp: 10, done: false }
];

const listEl = document.getElementById('activityList');
const xpLabel = document.getElementById('xpLabel');
const xpFill = document.getElementById('xpFill');

function renderActivities() {
  listEl.innerHTML = activities.map(function (a) {
    const btnLabel = a.done ? 'Completed' : 'Start';
    const btnBg = a.done ? 'var(--teal-100)' : 'var(--teal-700)';
    const btnColor = a.done ? 'var(--teal-700)' : '#FFFFFF';
    return '<div class="card" style="padding:14px 16px;display:flex;align-items:center;gap:12px;">' +
      '<div style="flex-grow:1;"><div style="font-size:14px;font-weight:700;color:var(--teal-900);">' + a.title + '</div>' +
      '<div style="font-size:11.5px;color:var(--muted);margin-top:2px;">' + a.meta + ' &middot; +' + a.xp + ' XP</div></div>' +
      '<button data-id="' + a.id + '" style="background:' + btnBg + ';color:' + btnColor + ';font-size:12.5px;font-weight:700;padding:9px 14px;border-radius:999px;flex-shrink:0;">' + btnLabel + '</button></div>';
  }).join('');
  const pct = Math.max(0, Math.min(100, Math.round((xp / xpTarget) * 100)));
  xpLabel.textContent = xp + ' / ' + xpTarget + ' XP';
  xpFill.style.width = pct + '%';
  Array.prototype.forEach.call(listEl.querySelectorAll('button'), function (btn) {
    btn.addEventListener('click', function () { toggle(parseInt(btn.getAttribute('data-id'), 10)); });
  });
}

function toggle(id) {
  const a = activities.find(function (x) { return x.id === id; });
  a.done = !a.done;
  xp = Math.max(0, xp + (a.done ? a.xp : -a.xp));
  renderActivities();
}

renderActivities();
</script>
</body>
</html>
