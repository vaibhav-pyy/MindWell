<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MindWell — Welcome</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="phone-wrap">
  <div class="phone" style="padding:56px 32px 40px;">
    <div style="position:absolute;top:-60px;right:-60px;width:200px;height:200px;border-radius:50%;background:var(--teal-100);"></div>
    <div style="position:absolute;top:110px;left:-70px;width:150px;height:150px;border-radius:50%;background:var(--coral-100);"></div>
    <div style="position:relative;display:flex;flex-direction:column;align-items:center;gap:18px;margin-top:40px;">
      <div style="width:72px;height:72px;border-radius:20px;background:var(--teal-700);display:flex;align-items:center;justify-content:center;">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none"><path d="M12 21s-7.5-4.6-10-9.1C.4 8.8 2 5 6 5c2.2 0 3.6 1.3 4 2 .4-.7 1.8-2 4-2 4 0 5.6 3.8 4 6.9C19.5 16.4 12 21 12 21z" stroke="#FFFFFF" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </div>
      <div style="text-align:center;">
        <div style="font-size:28px;font-weight:800;color:var(--teal-900);letter-spacing:-0.5px;">MindWell</div>
        <div style="font-size:15px;color:var(--muted);margin-top:8px;line-height:1.55;max-width:260px;">A private space to check in with yourself between classes.</div>
      </div>
    </div>
    <div style="flex-grow:1;"></div>
    <div style="position:relative;display:flex;flex-direction:column;gap:12px;">
      <a href="chat.html" style="background:var(--teal-700);color:#FFFFFF;text-align:center;padding:16px;border-radius:14px;font-weight:700;font-size:16px;">Continue as Student</a>
      <a href="teacher.html" style="background:transparent;border:1.5px solid var(--teal-700);color:var(--teal-700);text-align:center;padding:14.5px;border-radius:14px;font-weight:700;font-size:16px;">Continue as Teacher</a>
    </div>
    <div class="crisis-note">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="5" y="11" width="14" height="9" rx="2" stroke="var(--coral-700)" stroke-width="1.6"/><path d="M8 11V7a4 4 0 0 1 8 0v4" stroke="var(--coral-700)" stroke-width="1.6" fill="none"/></svg>
      <div>MindWell is a wellbeing companion, not a substitute for professional care. If you are in crisis, please contact your campus counsellor or local emergency services immediately.</div>
    </div>
  </div>
</div>
</body>
</html>
