<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MindWell — Chat</title>
<link rel="stylesheet" href="styles.css">
<script src="nav.js"></script>
</head>
<body>
<div class="phone-wrap">
  <div class="phone">
    <div style="display:flex;align-items:center;gap:10px;padding:20px 16px 14px;border-bottom:1px solid var(--border);background:var(--card);flex-shrink:0;">
      <div style="width:36px;height:36px;border-radius:10px;background:var(--teal-700);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 21s-7.5-4.6-10-9.1C.4 8.8 2 5 6 5c2.2 0 3.6 1.3 4 2 .4-.7 1.8-2 4-2 4 0 5.6 3.8 4 6.9C19.5 16.4 12 21 12 21z" stroke="#FFFFFF" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </div>
      <div style="flex-grow:1;">
        <div style="font-size:15px;font-weight:700;color:var(--teal-900);">MindWell Companion</div>
        <div style="font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:2px;"><span style="width:6px;height:6px;border-radius:50%;background:#3FAE6A;display:inline-block;"></span>Always here to listen</div>
      </div>
      <div style="background:var(--teal-100);color:var(--teal-900);font-size:12px;font-weight:700;padding:6px 11px;border-radius:999px;">72</div>
    </div>
    <div id="scroll" style="flex-grow:1;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:12px;"></div>
    <div style="display:flex;gap:10px;padding:12px 16px;border-top:1px solid var(--border);background:var(--card);align-items:center;flex-shrink:0;">
      <label for="chatInput" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);">Message MindWell</label>
      <input id="chatInput" type="text" placeholder="Type how you're feeling..." style="flex-grow:1;border:1px solid var(--border);border-radius:20px;padding:11px 16px;font-size:14px;outline:none;"/>
      <button id="sendBtn" aria-label="Send message" style="width:40px;height:40px;border-radius:50%;background:var(--teal-700);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 12h14M14 6l6 6-6 6" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div id="navSlot"></div>
  </div>
</div>
<script>
document.getElementById('navSlot').innerHTML = renderBottomNav('chat');

const messages = [
  { from: 'ai', text: "Hi! I'm your MindWell companion. How are you feeling about your exams this week?" },
  { from: 'user', text: "Honestly kind of overwhelmed, I have three tests next week." },
  { from: 'ai', text: "That sounds like a lot to carry at once. Want to break the studying into smaller blocks, or talk through what feels most urgent first?" }
];
const replies = [
  "Thanks for telling me. Want to try a short breathing exercise before you get back to studying?",
  "That makes sense. Breaking it into 25-minute focus blocks sometimes helps — want a quick plan?",
  "I hear you. Would journaling for two minutes about what's worrying you most help right now?"
];

const scrollEl = document.getElementById('scroll');
function renderMessages() {
  scrollEl.innerHTML = messages.map(function (m) {
    const align = m.from === 'user' ? 'flex-end' : 'flex-start';
    const bg = m.from === 'user' ? 'var(--teal-700)' : 'var(--teal-100)';
    const color = m.from === 'user' ? '#FFFFFF' : 'var(--teal-900)';
    return '<div style="display:flex;flex-direction:column;align-items:' + align + ';">' +
      '<div style="max-width:78%;background:' + bg + ';color:' + color + ';padding:12px 14px;border-radius:16px;font-size:14.5px;line-height:1.5;">' + m.text + '</div></div>';
  }).join('');
  scrollEl.scrollTop = scrollEl.scrollHeight;
}
renderMessages();

function send() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  messages.push({ from: 'user', text: text });
  messages.push({ from: 'ai', text: replies[Math.floor(Math.random() * replies.length)] });
  input.value = '';
  renderMessages();
}
document.getElementById('sendBtn').addEventListener('click', send);
document.getElementById('chatInput').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') { e.preventDefault(); send(); }
});
</script>
</body>
</html>
